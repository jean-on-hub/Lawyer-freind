services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:10000:10000"
    env_file:
      - .env
    environment:
      - PORT=10000
    volumes:
      - ./usage.db:/app/usage.db
      # The vector index is too large for git, so it is copied to the server with
      # scp and mounted here. When the directory is absent the app falls back to
      # the smaller FAISS index that does travel in the repo.
      - ./ghana_law_lancedb:/app/ghana_law_lancedb:ro
