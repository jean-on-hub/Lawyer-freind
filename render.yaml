services:
  - type: web
    name: lawyer-freind
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn scripts.app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
    healthCheckPath: /health
