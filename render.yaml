services:
  - type: web
    name: lawyer-freind
    runtime: python
    buildCommand: pip install -r requirements.txt && python scripts/download_model.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: HF_HOME
        value: /opt/render/project/src/.cache
    healthCheckPath: /health
